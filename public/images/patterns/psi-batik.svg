<svg viewBox="0 0 360 1200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <path id="petalOuter" d="M0,0 C-6,-22 -5,-44 0,-56 C5,-44 6,-22 0,0 Z"
          fill="none" stroke="#073b5c" stroke-width="1.3"/>
    <path id="petalInner" d="M0,0 C-4,-14 -3,-28 0,-34 C3,-28 4,-14 0,0 Z"
          fill="none" stroke="#073b5c" stroke-width="1.1"/>

    <g id="flowerCenter">
      <circle r="8" fill="none" stroke="#073b5c" stroke-width="1.1"/>
      <circle cx="0" cy="-4.5" r="1.2" fill="#073b5c"/>
      <circle cx="3" cy="-3" r="1.2" fill="#073b5c"/>
      <circle cx="4.5" cy="0" r="1.2" fill="#073b5c"/>
      <circle cx="3" cy="3" r="1.2" fill="#073b5c"/>
      <circle cx="0" cy="4.5" r="1.2" fill="#073b5c"/>
      <circle cx="-3" cy="3" r="1.2" fill="#073b5c"/>
      <circle cx="-4.5" cy="0" r="1.2" fill="#073b5c"/>
      <circle cx="-3" cy="-3" r="1.2" fill="#073b5c"/>
    </g>

    <g id="flower">
      <use href="#petalOuter" transform="rotate(0)"/>
      <use href="#petalOuter" transform="rotate(36)"/>
      <use href="#petalOuter" transform="rotate(72)"/>
      <use href="#petalOuter" transform="rotate(108)"/>
      <use href="#petalOuter" transform="rotate(144)"/>
      <use href="#petalOuter" transform="rotate(180)"/>
      <use href="#petalOuter" transform="rotate(216)"/>
      <use href="#petalOuter" transform="rotate(252)"/>
      <use href="#petalOuter" transform="rotate(288)"/>
      <use href="#petalOuter" transform="rotate(324)"/>
      <use href="#petalInner" transform="rotate(18)"/>
      <use href="#petalInner" transform="rotate(54)"/>
      <use href="#petalInner" transform="rotate(90)"/>
      <use href="#petalInner" transform="rotate(126)"/>
      <use href="#petalInner" transform="rotate(162)"/>
      <use href="#petalInner" transform="rotate(198)"/>
      <use href="#petalInner" transform="rotate(234)"/>
      <use href="#petalInner" transform="rotate(270)"/>
      <use href="#petalInner" transform="rotate(306)"/>
      <use href="#petalInner" transform="rotate(342)"/>
      <use href="#flowerCenter"/>
    </g>

    <g id="leaf">
      <path d="M0,0 C-9,-15 -7,-36 0,-48 C7,-36 9,-15 0,0 Z"
            fill="none" stroke="#073b5c" stroke-width="1.2"/>
      <path d="M0,-2 L0,-44" fill="none" stroke="#073b5c" stroke-width="0.9"/>
    </g>

    <g id="dots3">
      <circle cx="0" cy="0" r="2" fill="#073b5c"/>
      <circle cx="8" cy="-3.5" r="1.6" fill="#073b5c"/>
      <circle cx="15" cy="-9" r="1.2" fill="#073b5c"/>
    </g>

    <g id="lungCurl">
      <path d="M0,0 C20,-6 34,-22 28,-40 C22,-56 2,-58 -8,-46
               C-16,-36 -10,-24 0,-22 C6,-21 10,-16 6,-10 C3,-6 -3,-6 -6,-10"
            fill="none" stroke="#073b5c" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="10" cy="-9" r="1.2" fill="#073b5c"/>
      <circle cx="17" cy="-19" r="1.2" fill="#073b5c"/>
      <circle cx="20" cy="-31" r="1.1" fill="#073b5c"/>
      <circle cx="13" cy="-42" r="1" fill="#073b5c"/>
    </g>
  </defs>

  <!-- ================= SULUR / VINE UTAMA ================= -->
  <path d="M300,20
           C332,70 268,110 296,160
           C320,205 258,235 285,275
           C312,315 250,345 270,380
           C292,418 235,440 255,478
           C278,518 220,540 245,580
           C270,618 215,650 240,690
           C265,725 215,745 245,780
           C275,810 225,840 255,875
           C290,910 225,940 250,980
           C272,1015 225,1040 250,1075
           C270,1105 235,1125 255,1155
           C268,1175 250,1180 250,1188"
        fill="none" stroke="#073b5c" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= KLASTER DAUN — puncak ================= -->
  <use href="#leaf" transform="translate(315,55)  rotate(-20) scale(0.85)"/>
  <use href="#leaf" transform="translate(268,95)  rotate(155) scale(0.7)"/>
  <use href="#leaf" transform="translate(300,140) rotate(-10) scale(0.95)"/>
  <use href="#dots3" transform="translate(255,130) rotate(20)"/>

  <!-- ================= BUNGA BESAR — atas ================= -->
  <g transform="translate(283,270)">
    <use href="#flower"/>
  </g>

  <!-- ================= MOTIF LUNG-LUNGAN — tengah atas ================= -->
  <use href="#lungCurl" transform="translate(235,430) rotate(15) scale(1)"/>
  <use href="#dots3" transform="translate(300,400) rotate(200)"/>

  <!-- ================= KLASTER DAUN — tengah ================= -->
  <use href="#leaf" transform="translate(250,505) rotate(150) scale(0.8)"/>
  <use href="#leaf" transform="translate(285,545) rotate(-15) scale(0.9)"/>
  <use href="#leaf" transform="translate(225,600) rotate(160) scale(0.65)"/>
  <use href="#leaf" transform="translate(268,655) rotate(-5)  scale(0.85)"/>
  <use href="#dots3" transform="translate(310,585) rotate(-30)"/>

  <!-- ================= MOTIF LUNG-LUNGAN — kecil, tengah bawah ================= -->
  <use href="#lungCurl" transform="translate(255,715) rotate(-160) scale(0.7)"/>

  <!-- ================= BUNGA — bawah (sedikit lebih kecil) ================= -->
  <g transform="translate(255,850) scale(0.82)">
    <use href="#flower"/>
  </g>

  <!-- ================= KLASTER DAUN — bawah ================= -->
  <use href="#leaf" transform="translate(300,950)  rotate(15)  scale(0.9)"/>
  <use href="#leaf" transform="translate(232,995)  rotate(-150) scale(0.7)"/>
  <use href="#leaf" transform="translate(280,1055) rotate(5)   scale(0.85)"/>
  <use href="#leaf" transform="translate(225,1100) rotate(160) scale(0.65)"/>
  <use href="#dots3" transform="translate(268,1130) rotate(60)"/>
  <use href="#dots3" transform="translate(240,1170) rotate(-40)"/>

</svg>
